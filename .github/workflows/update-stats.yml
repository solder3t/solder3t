name: Update GitHub Stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch Stats
        run: |
          mkdir -p assets
          curl -s "https://github-readme-stats-eight-theta.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&include_all_commits=true" -o assets/github-stats.svg
          curl -s "https://github-readme-stats-eight-theta.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&theme=tokyonight" -o assets/top-langs.svg
          curl -s "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&theme=tokyonight&hide_border=true" -o assets/activity-graph.svg

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update github stats" && git push)
